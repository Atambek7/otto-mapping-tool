services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: otto_mapping_backend
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./backend/mapping_tool.db:/app/mapping_tool.db
      - ./backend/users.json:/app/users.json
      - ./backend/data:/app/data
    env_file:
      - ./backend/.env
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql://otto_user:otto_pass@db:5432/otto_db
    depends_on:
      - db

  db:
    image: postgres:15-alpine
    container_name: otto_mapping_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: otto_user
      POSTGRES_PASSWORD: otto_pass
      POSTGRES_DB: otto_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8001
    container_name: otto_mapping_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
