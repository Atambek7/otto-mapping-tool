name: CI Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend Tests & Migrations
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: otto_user
          POSTGRES_PASSWORD: otto_pass
          POSTGRES_DB: otto_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest

      - name: Initialize Database Schema
        env:
          DATABASE_URL: postgresql+psycopg2://otto_user:otto_pass@localhost:5432/otto_db
          SECRET_KEY: ci-secret-key-for-testing-only-12345
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python scripts/ci_init_db.py
          alembic stamp head

      - name: Run Backend Unit Tests
        env:
          DATABASE_URL: postgresql+psycopg2://otto_user:otto_pass@localhost:5432/otto_db
          CELERY_BROKER_URL: redis://localhost:6379/0
          SECRET_KEY: ci-secret-key-for-testing-only-12345
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python -m unittest discover tests
          python test_furniture_rules.py
          python test_category_rules.py

  frontend-ci:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript & Next.js Build Check
        env:
          NEXT_PUBLIC_API_URL: /api
          API_URL: http://localhost:8001
        run: |
          cd frontend
          npm run build

  restart-backend-ci:
    name: OttoRestart Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: restart_test
          POSTGRES_PASSWORD: restart_test
          POSTGRES_DB: ottorestart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'OTTO restart project/backend/requirements-dev.txt'

      - name: Install OttoRestart Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r 'OTTO restart project/backend/requirements-dev.txt'

      - name: Run OttoRestart Backend Tests
        working-directory: 'OTTO restart project/backend'
        env:
          OTTORESTART_DATABASE_URL: postgresql+psycopg://blocked:blocked@127.0.0.1:1/blocked_test
          OTTORESTART_TEST_DATABASE_URL: postgresql+psycopg://restart_test:restart_test@127.0.0.1:5432/ottorestart_test
          OTTORESTART_INTERNAL_AUTH_SECRET: ci-restart-secret-for-tests-only-123456
        run: python -m pytest

  restart-frontend-ci:
    name: OttoRestart Frontend Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 'OTTO restart project/package-lock.json'

      - name: Install OttoRestart Dependencies
        working-directory: 'OTTO restart project'
        run: npm ci

      - name: Build OttoRestart Frontend
        working-directory: 'OTTO restart project'
        env:
          NEXT_PUBLIC_OTTORESTART_MODE: DEMO
          API_URL: http://127.0.0.1:8001
        run: npm run build
